<title>Vale de Obra</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@700;800&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap">
<style>
/* Layout: panel de control con barra lateral fija (navegación + corte en curso) y área principal en tarjetas tipo vidrio; en móvil la barra lateral pasa arriba */
:root {
  --bg: #edf0f8;
  --glow-1: rgb(99 102 241 / .12);
  --glow-2: rgb(37 99 235 / .08);
  --surface: #ffffff;
  --surface-2: #f4f6fc;
  --side: #ffffff;
  --line: #dde2f1;
  --line-soft: #eaedf7;
  --ink: #0e1330;
  --ink-2: #464f78;
  --muted: #6a7299;
  --accent: #4f46e5;
  --accent-2: #7c3aed;
  --accent-3: #2563eb;
  --accent-ink: #ffffff;
  --accent-soft: #e8e8fd;
  --halo: rgb(79 70 229 / .28);
  --mark-wash: rgb(79 70 229 / .06);
  --s1: #2563eb;
  --s2: #e11d48;
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c6: #008300; --c7: #6250d6;
  --track: #dce5fb;
  --good: #0a8a3a;
  --warn: #a15c07;
  --warn-bg: #fff2d6;
  --crit: #c81e3a;
  --crit-bg: #fde4ea;
  --shadow: 0 1px 2px rgb(14 19 48 / .04), 0 10px 28px rgb(14 19 48 / .07);
  --f-brand: "Exo 2", "Barlow Semi Condensed", "Segoe UI", sans-serif;
  --f-body: "Barlow Semi Condensed", "Segoe UI", system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #050917; --glow-1: rgb(99 102 241 / .22); --glow-2: rgb(37 99 235 / .16);
    --surface: #0b1128; --surface-2: #10183a; --side: #080d22; --line: #1c2750; --line-soft: #151f43;
    --ink: #e8ebff; --ink-2: #a8b0d8; --muted: #7780ab;
    --accent: #6366f1; --accent-2: #8b5cf6; --accent-3: #3b82f6; --accent-ink: #ffffff; --accent-soft: #1a1f4f;
    --halo: rgb(99 102 241 / .55); --mark-wash: rgb(99 102 241 / .10);
    --s1: #3b82f6; --s2: #f43f5e;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9;
    --track: #16264f; --good: #34d399; --warn: #fbbf24; --warn-bg: #2f2408; --crit: #fb7185; --crit-bg: #3a1121;
    --shadow: 0 0 0 1px rgb(255 255 255 / .015), 0 14px 36px rgb(0 0 0 / .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #050917; --glow-1: rgb(99 102 241 / .22); --glow-2: rgb(37 99 235 / .16);
  --surface: #0b1128; --surface-2: #10183a; --side: #080d22; --line: #1c2750; --line-soft: #151f43;
  --ink: #e8ebff; --ink-2: #a8b0d8; --muted: #7780ab;
  --accent: #6366f1; --accent-2: #8b5cf6; --accent-3: #3b82f6; --accent-ink: #ffffff; --accent-soft: #1a1f4f;
  --halo: rgb(99 102 241 / .55); --mark-wash: rgb(99 102 241 / .10);
  --s1: #3b82f6; --s2: #f43f5e;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9;
  --track: #16264f; --good: #34d399; --warn: #fbbf24; --warn-bg: #2f2408; --crit: #fb7185; --crit-bg: #3a1121;
  --shadow: 0 0 0 1px rgb(255 255 255 / .015), 0 14px 36px rgb(0 0 0 / .45);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: radial-gradient(900px 520px at 85% -8%, var(--glow-1), transparent 62%),
              radial-gradient(800px 600px at 8% 40%, var(--glow-2), transparent 60%), var(--bg);
  background-attachment: fixed;
  color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45;
}
button, input, select, textarea { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Estructura */
.app { display: grid; grid-template-columns: 252px minmax(0, 1fr); gap: 20px; max-width: 1480px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 40px; }
aside.side { position: sticky; top: calc(18px + env(safe-area-inset-top, 0px)); align-self: start; display: grid; gap: 16px;
  background: var(--side); border: 1px solid var(--line); border-radius: 18px; padding: 18px 14px; box-shadow: var(--shadow); }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 6px 6px; }
.brand svg { width: 38px; height: 38px; flex: none; filter: drop-shadow(0 0 8px var(--halo)); }
.brand b { font-family: var(--f-brand); font-weight: 800; font-size: 21px; letter-spacing: .06em; line-height: 1; text-transform: uppercase;
  background: linear-gradient(90deg, var(--accent-3), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.brand small { display: block; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-top: 4px; font-weight: 600; }
nav.nav { display: grid; gap: 4px; }
nav.nav button { display: flex; align-items: center; gap: 11px; border: 0; background: none; padding: 10px 12px; border-radius: 10px; color: var(--ink-2);
  font-weight: 600; font-size: 15px; cursor: pointer; text-align: left; white-space: nowrap; }
nav.nav button svg { width: 18px; height: 18px; flex: none; }
nav.nav button:hover { background: var(--surface-2); color: var(--ink); }
nav.nav button[aria-selected="true"] { color: #fff; background: linear-gradient(90deg, var(--accent), var(--accent-2)); box-shadow: 0 6px 18px -6px var(--halo); }
.live { border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; background: var(--surface-2); }
.live .k { font-size: 12px; color: var(--muted); }
.live .v { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.2; }
.live h4 { margin: 0; font-size: 17px; }
.theme-sw { display: flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
.theme-sw button { flex: 1; border: 0; background: none; padding: 6px 8px; border-radius: 7px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; display: inline-flex; gap: 6px; justify-content: center; align-items: center; }
.theme-sw button svg { width: 14px; height: 14px; }
.theme-sw button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px rgb(0 0 0 / .12); }

.mainc { min-width: 0; display: grid; gap: 18px; align-content: start; }
.topbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 18px; box-shadow: var(--shadow); }
.topbar h1 { margin: 0; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); font-weight: 700; }
.topbar .meta { font-size: 18px; font-weight: 600; color: var(--ink); text-wrap: balance; }
#view { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
#view > *, .panel, .corte-grid > *, .dash-grid > *, .mem-grid > * { min-width: 0; }

@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); padding-block: 12px 32px; }
  aside.side { position: static; grid-template-columns: minmax(0, 1fr) auto; align-items: center; padding: 12px; }
  nav.nav { grid-column: 1 / -1; grid-row: 2; display: flex; overflow-x: auto; scrollbar-width: none; }
  .live { display: none; }
  .theme-sw { grid-column: 2; grid-row: 1; }
}

/* Tarjetas */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.panel > .hd { padding: 16px 18px 10px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
.panel > .bd { padding: 0 18px 18px; }
h2 { font-size: 14px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; margin: 0; text-wrap: balance; color: var(--ink); }
h2.big { font-size: 24px; letter-spacing: .01em; text-transform: none; }
h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); margin: 0 0 8px; font-weight: 600; }
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 600; }

/* Controles */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface-2); padding: 8px 13px; border-radius: 9px; font-weight: 600; cursor: pointer; color: var(--ink); }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: linear-gradient(90deg, var(--accent-3), var(--accent-2)); border-color: transparent; color: var(--accent-ink); box-shadow: 0 6px 20px -6px var(--halo); }
.btn.primary:hover { filter: brightness(1.1); }
.btn.danger { color: var(--crit); }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.btn svg { width: 16px; height: 16px; }
label.fld { display: grid; gap: 4px; font-size: 13px; color: var(--ink-2); font-weight: 500; }
.inp, select.inp, textarea.inp { width: 100%; border: 1px solid var(--line); background: var(--surface-2); border-radius: 9px; padding: 7px 10px; min-width: 0; color: var(--ink); }
.inp:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.inp:disabled { color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.grid-f { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(150px, 100%), 1fr)); gap: 12px; }

/* Selector de cortes */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 4px; scrollbar-width: thin; }
.chip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 6px 11px; cursor: pointer; display: grid; text-align: left; min-width: 70px; line-height: 1.2; color: var(--ink); }
.chip b { font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip span { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 6px 16px -8px var(--halo); }
.chip.add { color: var(--accent); font-weight: 600; place-items: center; border-style: dashed; white-space: nowrap; }

.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 2px 9px; border-radius: 999px; white-space: nowrap; border: 1px solid currentColor; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 6px currentColor; }
.st-borrador { color: var(--muted); }
.st-aprobado { color: var(--warn); }
.st-pagado { color: var(--good); }

/* Tablas */
.tbl-wrap { overflow-x: auto; border-top: 1px solid var(--line); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
thead th { position: sticky; top: 0; background: var(--surface-2); font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; text-align: left; vertical-align: bottom; border-bottom: 1px solid var(--line); }
thead th.num { text-align: right; }
td.now, th.now { background: var(--mark-wash); }
th.now { color: var(--accent); }
tr.grp td { font-weight: 700; font-size: 11.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--accent); padding-top: 12px; }
tr.sub td { font-weight: 700; border-top: 1px solid var(--line); }
td.desc { min-width: 240px; }
td .cod { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
tr.zero td { color: var(--muted); }
tbody tr:hover td { background-color: var(--mark-wash); }
.over { color: var(--crit); font-weight: 600; }
.tbl-inp { width: 100%; min-width: 70px; border: 1px solid transparent; background: transparent; padding: 3px 6px; border-radius: 6px; text-align: inherit; color: var(--ink); }
.tbl-inp:hover { border-color: var(--line); }
.tbl-inp:focus { border-color: var(--accent); background: var(--surface); outline: none; }
.tbl-inp option { background: var(--surface); }

/* Liquidación */
.liq { display: grid; max-width: 540px; margin-left: auto; }
.liq div { display: flex; justify-content: space-between; gap: 16px; padding: 7px 0; border-bottom: 1px dashed var(--line); }
.liq div span:last-child { font-variant-numeric: tabular-nums; }
.liq .neg span:last-child { color: var(--crit); }
.liq .tot { border: 0; margin-top: 8px; padding: 12px 14px; border-radius: 12px; font-weight: 700; font-size: 19px;
  background: linear-gradient(90deg, var(--accent-3), var(--accent-2)); color: #fff; box-shadow: 0 8px 22px -10px var(--halo); }
.corte-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 1000px) { .corte-grid { grid-template-columns: 1fr; } .liq { max-width: none; } }

/* Dashboard */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 1150px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .kpis { grid-template-columns: minmax(0, 1fr); } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px 10px; display: grid; gap: 2px; align-content: start; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.kpi .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.kpi .lbl { font-size: 14px; color: var(--ink-2); font-weight: 500; }
.kpi .ic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.kpi .ic svg { width: 17px; height: 17px; }
.kpi .val { font-size: 30px; font-weight: 600; line-height: 1.15; margin-top: 4px; }
.kpi .foot { display: flex; align-items: end; justify-content: space-between; gap: 8px; }
.kpi .sub { font-size: 13px; color: var(--muted); }
.kpi .sub b { color: var(--good); font-weight: 600; }
.kpi .spark { width: 46%; max-width: 140px; height: 34px; flex: none; }
.kpi.lead { border-color: var(--accent); box-shadow: var(--shadow), 0 0 0 1px var(--accent) inset; }
.dash-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; align-items: start; }
.dash-grid .span2 { grid-column: span 2; }
@media (max-width: 1150px) { .dash-grid { grid-template-columns: minmax(0, 1fr); } .dash-grid .span2 { grid-column: auto; } }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .ax { fill: var(--muted); font-size: 11px; font-family: var(--f-body); }
.chart .grid { stroke: var(--line-soft); stroke-width: 1; }
.chart .base { stroke: var(--line); stroke-width: 1; }
.chart .lbl { fill: var(--ink-2); font-size: 11px; font-weight: 600; font-family: var(--f-body); }
.chart .hit { fill: transparent; cursor: crosshair; }
.chart .hit:focus { outline: none; }
.chart .hit:focus-visible { stroke: var(--accent); stroke-width: 1.5; }
.chart .xh { stroke: var(--ink-2); stroke-width: 1; }
.chart .seg { cursor: pointer; transition: opacity .15s; }
.chart .seg:hover, .chart .seg:focus { opacity: .82; outline: none; }
.chart .ctr-v { fill: var(--ink); font-size: 17px; font-weight: 700; font-family: var(--f-body); }
.chart .ctr-l { fill: var(--muted); font-size: 11px; font-family: var(--f-body); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--ink-2); margin-bottom: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
.legend i.ln { height: 2px; width: 14px; vertical-align: 3px; border-radius: 1px; }
.tip { position: absolute; pointer-events: none; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 28px rgb(0 0 0 / .25); padding: 8px 11px; font-size: 13px; min-width: 160px; z-index: 5; }
.tip .t { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.tip .r { display: flex; align-items: center; gap: 8px; }
.tip .r b { font-variant-numeric: tabular-nums; }
.tip .r i { width: 12px; height: 2px; border-radius: 1px; display: inline-block; }
.tip .r span { color: var(--ink-2); }
details.tv { margin-top: 8px; }
details.tv summary { cursor: pointer; font-size: 13px; color: var(--accent); font-weight: 600; }
details.tv table { margin-top: 6px; font-size: 13px; }
.donut-wrap { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; justify-items: center; }
.dleg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; font-size: 14px; width: 100%; }
@media (max-width: 1150px) and (min-width: 600px) { .donut-wrap { grid-template-columns: 180px minmax(0, 1fr); align-items: center; } }
.dleg div { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.dleg i { width: 10px; height: 10px; border-radius: 50%; }
.dleg span:last-child { font-variant-numeric: tabular-nums; color: var(--ink-2); font-weight: 600; }
.dleg small { display: block; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.slist { display: grid; }
.slist > div { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 9px 0; border-bottom: 1px solid var(--line-soft); align-items: center; }
.slist > div:last-child { border-bottom: 0; }
.slist .n { font-weight: 600; }
.slist .d { font-size: 12px; color: var(--muted); }
.slist .m { font-variant-numeric: tabular-nums; text-align: right; font-weight: 600; }
.meter { position: relative; height: 8px; background: var(--track); border-radius: 999px; min-width: 90px; overflow: hidden; }
.meter > span { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, var(--accent-3), var(--accent-2)); border-radius: 999px; }
.meter.over > span { background: var(--crit); }
.flag { display: inline-flex; gap: 4px; align-items: center; font-size: 12px; font-weight: 600; padding: 1px 7px; border-radius: 6px; white-space: nowrap; }
.flag svg { width: 12px; height: 12px; }
.flag.crit { color: var(--crit); background: var(--crit-bg); }
.flag.warn { color: var(--warn); background: var(--warn-bg); }

/* Memoria */
.mem-grid { display: grid; grid-template-columns: minmax(0, 390px) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 1100px) { .mem-grid { grid-template-columns: minmax(0, 1fr); } }
.plantillas { display: flex; flex-wrap: wrap; gap: 6px; }
.plantillas button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.plantillas button:hover { border-color: var(--accent); color: var(--ink); }
.plantillas button[aria-pressed="true"] { background: linear-gradient(90deg, var(--accent), var(--accent-2)); color: #fff; border-color: transparent; }
.preview { border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface-2); display: grid; gap: 6px; font-size: 13px; }
.preview .pl { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.preview .pl .c { color: var(--muted); font-size: 12px; }
.hint { font-size: 12.5px; color: var(--muted); }
.note { padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); color: var(--ink); font-size: 14px; }
.note.lock { background: var(--warn-bg); }
.empty { padding: 40px 16px; text-align: center; color: var(--ink-2); display: grid; gap: 6px; justify-items: center; }
.empty h2 { color: var(--ink); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(90deg, var(--accent-3), var(--accent-2)); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 30; max-width: calc(100% - 32px); box-shadow: 0 10px 28px -8px var(--halo); }
.ro-banner { font-size: 13px; color: var(--ink-2); }
@media (prefers-reduced-motion: no-preference) { .meter > span { transition: width .35s ease; } }
</style>

<div class="app">
  <aside class="side">
    <div class="brand">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <defs><linearGradient id="bgr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs>
        <ellipse cx="20" cy="20" rx="18" ry="7.5" transform="rotate(-24 20 20)" fill="none" stroke="url(#bgr)" stroke-width="1.6" opacity=".9"/>
        <rect x="9" y="22" width="10" height="6" rx="1.2" fill="url(#bgr)"/><rect x="21" y="22" width="10" height="6" rx="1.2" fill="url(#bgr)"/>
        <rect x="15" y="14.5" width="10" height="6" rx="1.2" fill="url(#bgr)"/>
        <path d="M30 6.5l1.1 2.6 2.6 1.1-2.6 1.1L30 13.9l-1.1-2.6-2.6-1.1 2.6-1.1Z" fill="#c4b5fd"/>
      </svg>
      <div><b>Vale de Obra</b><small id="brandSub">Mampostería</small></div>
    </div>
    <nav class="nav" role="tablist" aria-label="Secciones">
      <button role="tab" data-tab="dashboard" aria-selected="false" id="tab-dashboard"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 3h6v8H3zM11 3h6v5h-6zM11 10h6v7h-6zM3 13h6v4H3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>Dashboard</button>
      <button role="tab" data-tab="corte" aria-selected="true" id="tab-corte"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 2.5h7l3.5 3.5v11.5H5zM12 2.5V6h3.5M8 10h5M8 13h5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>Corte de obra</button>
      <button role="tab" data-tab="memoria" aria-selected="false" id="tab-memoria"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2.5 15.5h15M3.5 15.5v-4h6v4M10.5 15.5v-4h6v4M7 11.5v-4h6v4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>Memoria de cantidades</button>
      <button role="tab" data-tab="contrato" aria-selected="false" id="tab-contrato"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 6.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7ZM10 2v2.5M10 15.5V18M2 10h2.5M15.5 10H18M4.3 4.3l1.8 1.8M13.9 13.9l1.8 1.8M4.3 15.7l1.8-1.8M13.9 6.1l1.8-1.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Contrato e ítems</button>
    </nav>
    <div class="live" id="liveCard" hidden></div>
    <div class="theme-sw" role="group" aria-label="Modo de color">
      <button id="thLight" aria-pressed="false" title="Modo claro"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6 13 13M3 13l1.4-1.4M11.6 4.4 13 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>Claro</button>
      <button id="thDark" aria-pressed="false" title="Modo oscuro"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 10.2A5.8 5.8 0 0 1 5.8 2.5a5.8 5.8 0 1 0 7.7 7.7Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>Oscuro</button>
    </div>
  </aside>

  <div class="mainc">
    <header class="topbar">
      <div><h1 id="hTitle">Corte de obra</h1><div class="meta" id="hMeta">Ciudadela del Parque T4</div></div>
      <button class="btn primary" id="topNew" hidden>+ Nuevo corte</button>
    </header>
    <main id="view">
      <div class="panel"><div class="empty">
        <h2>Cargando el proyecto…</h2>
        <p>Aquí aparecen los cortes, la memoria de cantidades y el seguimiento de M.O. del contrato de mampostería.</p>
      </div></div>
    </main>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
"use strict";
/* ---------- Estado ---------- */
const S = {
  db: null, canWrite: true, cfg: null, items: {}, cortes: {}, lineas: {},
  got: { cfg: false, items: false, cortes: false }, subs: {},
  tab: "corte", sel: null, soloMov: true,
  dash: { hasta: null, frente: "", item: "i04" },
  mem: { pl: "sucio", corte: null, vals: {}, filtro: "" },
};
const DEF_CFG = { proyecto: "Ciudadela del Parque T4", contratante: "", contratista: "", contrato: "Mampostería", zona: "", utilidad: 0.05, ivaUtilidad: 0.19, garantia: 0.12, fic: 0.01 };
const FRENTES = ["Marcación", "Mampostería interior", "Fachada", "Andamios", "Concretos y dovelas", "Administración", "Descuentos"];
const ESTADOS = { borrador: "Borrador", aprobado: "Aprobado", pagado: "Pagado" };

/* ---------- Utilidades ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nf0 = new Intl.NumberFormat("es-CO", { maximumFractionDigits: 0 });
const nf2 = new Intl.NumberFormat("es-CO", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const COP = (v) => (v < 0 ? "−$ " : "$ ") + nf0.format(Math.abs(Math.round(v || 0)));
const Q = (v) => (Math.abs(v || 0) < 1e-9 ? "–" : nf2.format(v));
const PCT = (v) => (isFinite(v) ? nf2.format(v * 100).replace(/,00$/, "") + " %" : "–");
const compact = (v) => {
  const a = Math.abs(v);
  if (a >= 1e9) return (v / 1e9).toFixed(a >= 1e10 ? 0 : 1).replace(".", ",") + " mil M";
  if (a >= 1e6) return Math.round(v / 1e6) + " M";
  if (a >= 1e3) return Math.round(v / 1e3) + " K";
  return String(Math.round(v));
};
const parseNum = (x) => { let t = String(x ?? "").replace(/[$\s]/g, ""); if (t.includes(",")) t = t.replace(/\./g, ""); return evalExpr(t); };
const cid = (n) => "c" + String(n).padStart(2, "0");
const today = () => new Date().toISOString().slice(0, 10);
const fdate = (d) => { if (!d) return "Sin fecha"; const [y, m, dd] = d.split("-"); return `${dd}/${m}/${y}`; };
const ICON_WARN = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5 15 14H1L8 1.5Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 6v3.6M8 11.6v.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
const ICON_DL = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8m0 0 3-3m-3 3L5 7M2.5 13.5h11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 3200); }

/* Expresiones tipo Excel: "4.57+2.61*2" (acepta coma decimal) */
function evalExpr(src) {
  const s = String(src ?? "").replace(/\s+/g, "").replace(/,/g, ".");
  if (!s) return 0;
  let i = 0;
  const peek = () => s[i];
  function num() { const m = /^\d*\.?\d+(?:e[+-]?\d+)?/i.exec(s.slice(i)); if (!m) throw 0; i += m[0].length; return parseFloat(m[0]); }
  function fac() { if (peek() === "-") { i++; return -fac(); } if (peek() === "+") { i++; return fac(); } if (peek() === "(") { i++; const v = add(); if (peek() !== ")") throw 0; i++; return v; } return num(); }
  function mul() { let v = fac(); while (peek() === "*" || peek() === "/" || peek() === "x") { const o = s[i++]; const r = fac(); v = o === "/" ? v / r : v * r; } return v; }
  function add() { let v = mul(); while (peek() === "+" || peek() === "-") { const o = s[i++]; const r = mul(); v = o === "+" ? v + r : v - r; } return v; }
  try { const v = add(); if (i !== s.length || !isFinite(v)) return NaN; return v; } catch { return NaN; }
}

/* ---------- Cálculos ---------- */
const cfg = () => ({ ...DEF_CFG, ...(S.cfg || {}) });
const itemsSorted = () => Object.entries(S.items).map(([id, d]) => ({ id, ...d })).sort((a, b) => (a.orden ?? 999) - (b.orden ?? 999));
const cortesSorted = () => Object.entries(S.cortes).map(([id, d]) => ({ id, ...d })).sort((a, b) => a.n - b.n);
const lineasDe = (c) => Object.entries(S.lineas[c] || {}).map(([id, d]) => ({ id, ...d }));
function qtyByItem(c) { const m = {}; for (const l of lineasDe(c)) m[l.item] = (m[l.item] || 0) + (+l.cant || 0); return m; }
function liquidar(T, anticipo) {
  const p = cfg();
  const B = T / (1 + p.utilidad * p.ivaUtilidad);
  const gar = B * p.garantia, fic = B * p.fic, ant = +anticipo || 0;
  return { T, B, util: B * p.utilidad, ivaU: T - B, gar, fic, ant, neto: T - gar - fic - ant };
}
function corteCalc(c) {
  const co = S.cortes[c]; if (!co) return null;
  const its = itemsSorted();
  const now = qtyByItem(c), prev = {};
  for (const o of cortesSorted()) if (o.n < co.n) { const q = qtyByItem(o.id); for (const k in q) prev[k] = (prev[k] || 0) + q[k]; }
  let T = 0;
  const rows = its.map((it) => {
    const p = prev[it.id] || 0, n = now[it.id] || 0, acc = p + n;
    T += n * (it.vu || 0);
    return { it, prev: p, now: n, acc, vNow: n * (it.vu || 0), vAcc: acc * (it.vu || 0), pct: it.cant ? acc / it.cant : NaN };
  });
  return { co, rows, ...liquidar(T, co.anticipo) };
}
const valorContrato = () => itemsSorted().filter((i) => i.tipo !== "descuento").reduce((s, i) => s + (i.cant || 0) * (i.vu || 0), 0);

/* ---------- Base de datos ---------- */
async function guard(p, okMsg) {
  try { await p; if (okMsg) toast(okMsg); return true; }
  catch (e) {
    const code = e && e.code;
    if (code === "invalid_argument") { S.canWrite = false; toast("No tienes permiso para editar este proyecto. Los cambios no se guardaron."); render(); }
    else if (code === "quota_exceeded") toast("La base de datos del proyecto está llena. Elimina líneas antiguas para seguir agregando.");
    else toast("No se pudo guardar. Revisa tu conexión e intenta de nuevo.");
    return false;
  }
}
function subLineas(c) {
  if (S.subs[c]) return;
  S.subs[c] = S.db.collection(`cortes/${c}/lineas`).limit(1000).onSnapshot((snap) => {
    const m = {}; snap.docs.forEach((d) => (m[d.id] = d.data())); S.lineas[c] = m; schedule();
  }, () => {});
}
let rq = 0;
function schedule() { if (rq) return; rq = requestAnimationFrame(() => { rq = 0; render(); }); }

async function boot() {
  const claude = window.claude;
  if (!claude || !claude.use) { showNoDb(); return; }
  const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
  if (!db) { showNoDb(); return; }
  S.db = db;
  try { const can = user ? await user.can("data.write") : null; if (can === false) S.canWrite = false; } catch {}
  db.doc("config/proyecto").onSnapshot((d) => { S.cfg = d.exists ? d.data() : null; S.got.cfg = true; schedule(); }, () => {});
  db.collection("items").onSnapshot((snap) => { const m = {}; snap.docs.forEach((d) => (m[d.id] = d.data())); S.items = m; S.got.items = true; schedule(); }, () => {});
  db.collection("cortes").onSnapshot((snap) => {
    const m = {}; snap.docs.forEach((d) => (m[d.id] = d.data())); S.cortes = m; S.got.cortes = true;
    Object.keys(m).forEach(subLineas); schedule();
  }, () => {});
}
function showNoDb() {
  $("#view").innerHTML = `<div class="panel"><div class="empty"><h2>No hay acceso a los datos del proyecto</h2>
  <p>Abre esta página en claude.ai con tu sesión iniciada para ver y registrar los cortes de obra.</p></div></div>`;
}

/* ---------- Render principal ---------- */
function setTab(t) {
  S.tab = t;
  document.querySelectorAll("nav.nav button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === t)));
  try { localStorage.setItem("cm.tab", t); } catch {}
  render(true);
}
document.querySelectorAll("nav.nav button").forEach((b) => b.addEventListener("click", () => setTab(b.dataset.tab)));

function focusInside(el) { const a = document.activeElement; return a && a !== document.body && el.contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName); }
let pending = false;
document.addEventListener("focusout", () => { if (pending) setTimeout(() => { if (pending && !focusInside($("#view"))) { pending = false; render(); } }, 0); });

const TAB_T = { corte: "Corte de obra", memoria: "Memoria de cantidades", dashboard: "Dashboard", contrato: "Contrato e ítems" };
function renderLive() {
  const el = $("#liveCard"), cs = cortesSorted();
  const c = [...cs].reverse().find((x) => x.estado !== "pagado") || cs[cs.length - 1];
  if (!c) { el.hidden = true; return; }
  const K = corteCalc(c.id);
  el.hidden = false;
  el.innerHTML = `<div class="eyebrow">Corte en curso</div>
    <div style="display:grid;gap:4px"><h4>Corte N° ${c.n}</h4><span class="pill st-${esc(c.estado)}" style="justify-self:start">${esc(ESTADOS[c.estado] || c.estado)}</span></div>
    <div><div class="k">Valor del corte</div><div class="v">${COP(K.T)}</div></div>
    <div><div class="k">Valor a cancelar</div><div class="v">${COP(K.neto)}</div></div>
    <div><div class="k">Líneas en la memoria</div><div class="v">${lineasDe(c.id).length}</div></div>
    <button class="btn primary" id="liveGo" style="justify-content:center">Ver corte</button>`;
  $("#liveGo").addEventListener("click", () => { S.sel = c.id; S.mem.corte = null; setTab("corte"); });
}
async function newCorte() {
  const n = Math.max(0, ...cortesSorted().map((c) => c.n)) + 1;
  const ok = await guard(S.db.doc("cortes/" + cid(n)).set({ n, fecha: today(), estado: "borrador", anticipo: 0, obs: "" }), `Corte ${n} creado`);
  if (ok) { S.sel = cid(n); S.mem.corte = null; if (S.tab === "dashboard" || S.tab === "contrato") setTab("corte"); }
}
$("#topNew").addEventListener("click", newCorte);

/* ---------- Modo claro / oscuro ---------- */
const mq = matchMedia("(prefers-color-scheme: dark)");
const curTheme = () => document.documentElement.getAttribute("data-theme") || (mq.matches ? "dark" : "light");
function syncTheme() { const t = curTheme(); $("#thLight").setAttribute("aria-pressed", String(t === "light")); $("#thDark").setAttribute("aria-pressed", String(t === "dark")); }
function setTheme(t) { document.documentElement.setAttribute("data-theme", t); try { localStorage.setItem("vo.theme", t); } catch {} syncTheme(); }
$("#thLight").addEventListener("click", () => setTheme("light"));
$("#thDark").addEventListener("click", () => setTheme("dark"));
mq.addEventListener("change", syncTheme);
new MutationObserver(syncTheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
try { const t = localStorage.getItem("vo.theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch {}
syncTheme();

function render(force) {
  const v = $("#view");
  const p = cfg();
  $("#hTitle").textContent = TAB_T[S.tab];
  $("#hMeta").textContent = [p.proyecto, p.contratante, p.zona].filter(Boolean).join(" · ");
  $("#brandSub").textContent = p.contrato || "Cortes de obra";
  if (!S.got.items || !S.got.cortes) return;
  $("#topNew").hidden = !S.canWrite;
  renderLive();
  if (!force && focusInside(v)) { pending = true; return; }
  const cs = cortesSorted();
  if (!S.sel || !S.cortes[S.sel]) S.sel = cs.length ? cs[cs.length - 1].id : null;
  if (!itemsSorted().length) {
    v.innerHTML = `<div class="panel"><div class="empty"><h2>El proyecto aún no tiene ítems</h2>
      <p>Empieza por la pestaña <b>Contrato e ítems</b>: agrega cada actividad con su unidad, cantidad contratada y valor unitario.</p></div></div>`;
    if (S.tab === "contrato") renderContrato(v);
    return;
  }
  ({ corte: renderCorte, memoria: renderMemoria, dashboard: renderDash, contrato: renderContrato })[S.tab](v);
}

/* ---------- Selector de cortes ---------- */
function chipsHTML() {
  const cs = cortesSorted();
  return `<div class="chips" role="group" aria-label="Seleccionar corte">${cs.map((c) =>
    `<button class="chip" data-c="${c.id}" aria-pressed="${c.id === S.sel}"><b>Corte ${c.n}</b><span class="st-${esc(c.estado)}">${esc(ESTADOS[c.estado] || c.estado)}</span></button>`).join("")}
    ${S.canWrite ? `<button class="chip add" id="newCorte" title="Crear el siguiente corte">+ Nuevo corte</button>` : ""}</div>`;
}
function bindChips(v) {
  v.querySelectorAll(".chip[data-c]").forEach((b) => b.addEventListener("click", () => { S.sel = b.dataset.c; S.mem.corte = null; render(true); }));
  const nb = $("#newCorte", v);
  if (nb) nb.addEventListener("click", newCorte);
}

/* ---------- Pestaña: Corte ---------- */
function renderCorte(v) {
  if (!S.sel) {
    v.innerHTML = `<div class="panel"><div class="hd"><h2>Cortes</h2></div><div class="bd">${chipsHTML()}<div class="empty"><p>Crea el primer corte para empezar a registrar cantidades.</p></div></div></div>`;
    bindChips(v); return;
  }
  const K = corteCalc(S.sel), co = K.co, p = cfg();
  const locked = co.estado === "pagado";
  const dis = !S.canWrite ? "disabled" : "";
  const rows = K.rows.filter((r) => !S.soloMov || Math.abs(r.now) > 1e-9);
  const byFr = {};
  rows.forEach((r) => (byFr[r.it.frente || "Otros"] ||= []).push(r));
  const order = [...FRENTES, ...Object.keys(byFr).filter((f) => !FRENTES.includes(f))];
  let body = "";
  for (const f of order) {
    const rs = byFr[f]; if (!rs) continue;
    body += `<tr class="grp"><td colspan="11">${esc(f)}</td></tr>`;
    for (const r of rs) {
      const over = r.it.cant && r.acc > r.it.cant + 1e-6 && r.it.tipo !== "descuento";
      body += `<tr class="${Math.abs(r.now) < 1e-9 ? "zero" : ""}">
        <td class="desc"><span class="cod">${esc(r.it.codigo)}${r.it.insumo ? " · " + esc(r.it.insumo) : ""}</span><br>${esc(r.it.desc)}</td>
        <td>${esc(r.it.um)}</td><td class="num">${Q(r.it.cant)}</td><td class="num">${COP(r.it.vu)}</td>
        <td class="num">${Q(r.prev)}</td><td class="num now"><b>${Q(r.now)}</b></td><td class="num">${Q(r.acc)}</td>
        <td class="num ${over ? "over" : ""}">${r.it.tipo === "descuento" ? "–" : PCT(r.pct)}</td>
        <td class="num now">${COP(r.vNow)}</td><td class="num">${COP(r.vAcc)}</td><td class="num">${r.it.cant ? Q(r.it.cant - r.acc) : "–"}</td></tr>`;
    }
  }
  const totAcc = K.rows.reduce((s, r) => s + r.vAcc, 0);
  v.innerHTML = `
  <div class="panel"><div class="hd"><div><div class="eyebrow">Acta de corte</div><h2 class="big">Corte N° ${co.n}</h2></div>
    <div class="row"><span class="pill st-${esc(co.estado)}">${esc(ESTADOS[co.estado] || co.estado)}</span>
      <button class="btn" id="dlCorte">${ICON_DL} Excel del corte</button><button class="btn" id="dlRes">${ICON_DL} Resumen general</button></div></div>
    <div class="bd" style="display:grid;gap:14px">${chipsHTML()}
      <div class="grid-f">
        <label class="fld">Fecha de corte<input class="inp" type="date" id="cFecha" value="${esc(co.fecha || "")}" ${dis}></label>
        <label class="fld">Estado<select class="inp" id="cEstado" ${dis}>${Object.entries(ESTADOS).map(([k, l]) => `<option value="${k}" ${co.estado === k ? "selected" : ""}>${l}</option>`).join("")}</select></label>
        <label class="fld">Amortización de anticipo ($)<input class="inp num" inputmode="decimal" id="cAnt" value="${co.anticipo ? nf0.format(co.anticipo) : ""}" placeholder="0" ${dis}></label>
        <label class="fld" style="grid-column:1/-1">Observaciones<input class="inp" id="cObs" value="${esc(co.obs || "")}" placeholder="Notas del corte" ${dis}></label>
      </div>
      ${locked ? `<div class="note lock">Este corte está <b>pagado</b>: su memoria de cantidades queda bloqueada. Cambia el estado si necesitas corregirlo.</div>` : ""}
      ${!S.canWrite ? `<div class="ro-banner">Vista de solo lectura: tu acceso no permite editar el proyecto.</div>` : ""}
    </div></div>

  <div class="panel"><div class="hd"><h2>Cantidades y valores</h2>
    <label class="small" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="soloMov" ${S.soloMov ? "checked" : ""}> Solo ítems con movimiento en este corte</label></div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Ítem</th><th>UM</th><th class="num">Cant. contratada</th><th class="num">VU contrato</th><th class="num">Acum. anterior</th>
      <th class="num now">Este corte</th><th class="num">Acumulado</th><th class="num">% contrato</th><th class="num now">Valor este corte</th><th class="num">Valor acumulado</th><th class="num">Saldo cant.</th></tr></thead>
      <tbody>${body || `<tr><td colspan="11" class="muted" style="padding:20px">Este corte todavía no tiene cantidades. Regístralas en la pestaña <b>Memoria de cantidades</b>.</td></tr>`}
      <tr class="sub"><td colspan="8">Total del corte</td><td class="num now">${COP(K.T)}</td><td class="num">${COP(totAcc)}</td><td></td></tr></tbody>
    </table></div></div>

  <div class="corte-grid">
    <div class="panel"><div class="hd"><h2>Resumen del corte</h2></div><div class="bd small" style="display:grid;gap:8px">

/* ---------- Pestaña: Dashboard ---------- */
function niceTicks(min, max, n = 4) {
  if (min === max) max = min + 1;
  const raw = (max - min) / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), r = raw / mag;
  const step = (r <= 1 ? 1 : r <= 2 ? 2 : r <= 2.5 ? 2.5 : r <= 5 ? 5 : 10) * mag;
  const t = []; for (let v = Math.floor(min / step) * step; v <= max + step * 0.001; v += step) t.push(+v.toFixed(10));
  if (t[t.length - 1] < max) t.push(t[t.length - 1] + step);
  return t;
}
function tipShow(wrap, x, y, title, rows) {
  let t = wrap.querySelector(".tip"); if (!t) { t = document.createElement("div"); t.className = "tip"; wrap.appendChild(t); }
  t.innerHTML = ""; const h = document.createElement("div"); h.className = "t"; h.textContent = title; t.appendChild(h);
  rows.forEach(([color, val, name]) => { const r = document.createElement("div"); r.className = "r"; const i = document.createElement("i"); i.style.background = color; const b = document.createElement("b"); b.textContent = val; const s = document.createElement("span"); s.textContent = name; r.append(i, b, s); t.appendChild(r); });
  t.hidden = false;
  const W = wrap.clientWidth, tw = t.offsetWidth;
  t.style.left = Math.max(0, Math.min(W - tw, x + 12)) + "px"; t.style.top = Math.max(0, y - t.offsetHeight - 8) + "px";
}
const tipHide = (wrap) => { const t = wrap.querySelector(".tip"); if (t) t.hidden = true; };
function roundBar(x, y0, y1, w) {
  const h = Math.abs(y1 - y0), r = Math.min(4, h, w / 2), up = y1 < y0;
  if (h < 0.5) return "";
  return up ? `M${x},${y0}V${y1 + r}Q${x},${y1} ${x + r},${y1}H${x + w - r}Q${x + w},${y1} ${x + w},${y1 + r}V${y0}Z`
            : `M${x},${y0}V${y1 - r}Q${x},${y1} ${x + r},${y1}H${x + w - r}Q${x + w},${y1} ${x + w},${y1 - r}V${y0}Z`;
}
function columnChart(wrap, { cats, titles, series, fmt, H = 230 }) {
  const W = Math.max(280, wrap.clientWidth || 600), m = { t: 12, r: 8, b: 26, l: 52 };
  const all = series.flatMap((s) => s.vals), lo = Math.min(0, ...all), hi = Math.max(0, ...all);
  const ticks = niceTicks(lo, hi), y0v = ticks[0], y1v = ticks[ticks.length - 1];
  const y = (v) => m.t + (H - m.t - m.b) * (1 - (v - y0v) / (y1v - y0v || 1));
  const band = (W - m.l - m.r) / cats.length, nS = series.length;
  const bw = Math.max(3, Math.min(24, (band * 0.72 - (nS - 1) * 2) / nS)), gw = bw * nS + (nS - 1) * 2;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(series.map((x) => x.name).join(" y "))} por corte">`;
  ticks.forEach((t) => { s += `<line class="${t === 0 ? "base" : "grid"}" x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}"/><text class="ax" x="${m.l - 6}" y="${y(t) + 4}" text-anchor="end">${compact(t)}</text>`; });
  cats.forEach((c, i) => {
    const gx = m.l + band * i + (band - gw) / 2;
    series.forEach((se, k) => { const d = roundBar(gx + k * (bw + 2), y(0), y(se.vals[i]), bw); if (d) s += `<path d="${d}" style="fill:${se.color}"/>`; });
    if (band > 26 || i % 2 === 0) s += `<text class="ax" x="${m.l + band * i + band / 2}" y="${H - 8}" text-anchor="middle">${esc(c)}</text>`;
  });
  cats.forEach((c, i) => { s += `<rect class="hit" data-i="${i}" tabindex="0" x="${m.l + band * i}" y="${m.t}" width="${band}" height="${H - m.t - m.b}" aria-label="${esc(titles[i])}"/>`; });
  s += "</svg>";
  wrap.innerHTML = s;
  const show = (i, x, yy) => tipShow(wrap, x, yy, titles[i], series.map((se) => [se.color, fmt(se.vals[i]), se.name]));
  wrap.querySelectorAll(".hit").forEach((r) => {
    const i = +r.dataset.i;
    r.addEventListener("pointermove", (e) => { const b = wrap.getBoundingClientRect(); show(i, e.clientX - b.left, e.clientY - b.top); });
    r.addEventListener("focus", () => { const k = wrap.clientWidth / W; show(i, (m.l + band * (i + 0.5)) * k, m.t * k + 40); });
    r.addEventListener("pointerleave", () => tipHide(wrap)); r.addEventListener("blur", () => tipHide(wrap));
  });
}
let gid = 0;
function lineChart(wrap, { cats, titles, series, fmt, H = 250 }) {

  const y0v = ticks[0], y1v = ticks[ticks.length - 1];
  const y = (v) => m.t + (H - m.t - m.b) * (1 - (v - y0v) / (y1v - y0v || 1));
  const n = cats.length, x = (i) => m.l + (n === 1 ? (W - m.l - m.r) / 2 : ((W - m.l - m.r) * i) / (n - 1));
  const id = "lg" + ++gid;

    <div class="tbl-wrap"><table><thead><tr><th>Código</th><th>Insumo</th><th>Descripción</th><th>Frente</th><th>UM</th><th class="num">Cant. contratada</th><th class="num">VU</th><th class="num">Valor</th><th></th></tr></thead><tbody>
    ${its.map((it) => `<tr data-i="${it.id}">
      <td><input class="tbl-inp" data-f="codigo" value="${esc(it.codigo)}" ${dis} aria-label="Código" style="min-width:64px"></td>
      <td><input class="tbl-inp" data-f="insumo" value="${esc(it.insumo)}" ${dis} aria-label="Insumo" style="min-width:64px"></td>
      <td style="min-width:280px"><input class="tbl-inp" data-f="desc" value="${esc(it.desc)}" ${dis} aria-label="Descripción"></td>
      <td><select class="tbl-inp" data-f="frente" ${dis} aria-label="Frente" style="min-width:150px">${[...new Set([...FRENTES, it.frente || ""])].filter(Boolean).map((f) => `<option ${f === it.frente ? "selected" : ""}>${esc(f)}</option>`).join("")}</select></td>
      <td><input class="tbl-inp" data-f="um" value="${esc(it.um)}" ${dis} aria-label="Unidad" style="min-width:60px"></td>
      <td class="num"><input class="tbl-inp num" data-f="cant" data-n="1" value="${nf2.format(it.cant || 0)}" ${dis} aria-label="Cantidad contratada"></td>
      <td class="num"><input class="tbl-inp num" data-f="vu" data-n="1" value="${nf0.format(it.vu || 0)}" ${dis} aria-label="Valor unitario"></td>
      <td class="num">${it.tipo === "descuento" ? "–" : COP((it.cant || 0) * (it.vu || 0))}</td>
      <td>${S.canWrite ? (used.has(it.id) ? `<span class="hint" title="Tiene cantidades registradas">En uso</span>` : `<button class="btn danger small" data-del>Eliminar</button>`) : ""}</td></tr>`).join("")}
    </tbody></table></div>
    ${S.canWrite ? `<div class="bd" style="padding-top:12px"><button class="btn" id="addItem">+ Agregar ítem</button></div>` : ""}
  </div>`;
  const parseN = (s) => { const n = evalExpr(String(s).replace(/\./g, "").replace(/\$/g, "")); return n; };
  v.querySelectorAll("[data-cfg]").forEach((i) => i.addEventListener("change", () => {
    let val = i.value;
    if (i.dataset.pct) { const n = evalExpr(val); if (isNaN(n)) { toast("Porcentaje no válido"); return; } val = n / 100; }
    const ref = S.db.doc("config/proyecto");
    guard(S.cfg ? ref.update({ [i.dataset.cfg]: val }) : ref.set({ ...DEF_CFG, [i.dataset.cfg]: val }));
  }));
  v.querySelectorAll("tr[data-i]").forEach((tr) => {
    const id = tr.dataset.i;

      let val = i.value;
      if (i.dataset.n) { val = i.dataset.f === "cant" ? parseNum(val) : parseN(val); if (isNaN(val)) { toast("Número no válido"); return; } }

    }));
    const d = tr.querySelector("[data-del]");
    if (d) d.addEventListener("click", () => {
      if (!d.dataset.armed) { d.dataset.armed = "1"; d.textContent = "¿Confirmar?"; setTimeout(() => { if (d.isConnected) { delete d.dataset.armed; d.textContent = "Eliminar"; } }, 3000); return; }
      guard(S.db.doc("items/" + id).delete(), "Ítem eliminado");
    });
  });
  const ab = $("#addItem", v);
  if (ab) ab.addEventListener("click", () => {
    const n = Math.max(0, ...its.map((i) => parseInt(i.id.slice(1)) || 0)) + 1;

    guard(S.db.doc("items/" + id).set({ orden: Math.max(0, ...its.map((i) => i.orden || 0)) + 1, codigo: "", insumo: "", desc: "Nuevo ítem", um: "und", cant: 0, vu: 0, frente: "Mampostería interior", zona: "" }), "Ítem agregado al final de la tabla");
  });
}

/* ---------- Exportar a Excel ---------- */
let xlsxP;
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return (xlsxP ||= new Promise((res, rej) => { const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; s.onload = () => res(window.XLSX); s.onerror = rej; document.head.appendChild(s); }));
}
async function saveWb(wb, filename) {
  const dl = await window.claude?.use?.("downloads");
  if (!dl) { toast("Las descargas no están disponibles en esta vista."); return; }
  const XLSX = window.XLSX;
  const data = new Uint8Array(XLSX.write(wb, { type: "array", bookType: "xlsx" }));
  try { await dl.save({ filename, data }); toast("Archivo listo: " + filename); }
  catch (e) { if (e && e.code !== "declined") toast("No se pudo generar la descarga."); }
}
function fmtCells(ws, XLSX, colsFmt, fromRow) {
  const r = XLSX.utils.decode_range(ws["!ref"]);
  for (let R = fromRow; R <= r.e.r; R++) for (const [C, z] of colsFmt) { const c = ws[XLSX.utils.encode_cell({ r: R, c: C })]; if (c && c.t === "n") c.z = z; }
}
async function exportCorte(c) {

    ["Frente", "Código", "Insumo", "Descripción", "UM", "Cant. contratada", "VU contrato", "Acum. anterior", "Este corte", "Acumulado", "% contrato", "Valor este corte", "Valor acumulado"]];

  aoa.push([], ["", "", "", "VALOR DEL CORTE SIN IVA", "", "", "", "", "", "", "", K.B], ["", "", "", "UTILIDAD", "", "", p.utilidad, "", "", "", "", K.util], ["", "", "", "IVA SOBRE LA UTILIDAD", "", "", p.ivaUtilidad, "", "", "", "", K.ivaU],
    ["", "", "", "VALOR TOTAL DEL CORTE CON IVA", "", "", "", "", "", "", "", K.T], ["", "", "", "RETENCIÓN GARANTÍA", "", "", p.garantia, "", "", "", "", -K.gar], ["", "", "", "RETENCIÓN FIC", "", "", p.fic, "", "", "", "", -K.fic],
    ["", "", "", "AMORTIZACIÓN ANTICIPO", "", "", "", "", "", "", "", -K.ant], ["", "", "", "VALOR A CANCELAR", "", "", "", "", "", "", "", K.neto]);
  const ws = XLSX.utils.aoa_to_sheet(aoa);

  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Corte " + K.co.n);
  const mem = [["Frente", "Piso", "Ubicación", "Descripción", "Código", "Ítem", "UM", "Cálculo", "Cantidad", "VU", "Valor"]];
  lineasDe(c).sort((a, b) => (a.ts || 0) - (b.ts || 0) || a.id.localeCompare(b.id)).forEach((l) => { const it = S.items[l.item] || {}; mem.push([l.frente, l.piso, l.ubic, l.desc, it.codigo, it.desc, it.um, l.calc, +l.cant || 0, it.vu || 0, (+l.cant || 0) * (it.vu || 0)]); });
  const wm = XLSX.utils.aoa_to_sheet(mem); wm["!cols"] = [18, 7, 16, 32, 9, 44, 7, 24, 12, 12, 14].map((w) => ({ wch: w }));

async function exportResumen() {

  const Ls = cs.map((c, k) => liquidar(its.reduce((s, it) => s + (qs[k][it.id] || 0) * (it.vu || 0), 0), c.anticipo));

  aoa.push([]); tot("VALOR DEL CORTE SIN IVA", (L) => L.B); tot("VALOR TOTAL CON IVA", (L) => L.T); tot("RETENCIÓN GARANTÍA", (L) => -L.gar); tot("RETENCIÓN FIC", (L) => -L.fic); tot("AMORTIZACIÓN ANTICIPO", (L) => -L.ant); tot("VALOR A CANCELAR", (L) => L.neto);
  const est = ["", "", "ESTADO", "", "", ""]; cs.forEach((c) => est.push("", ESTADOS[c.estado])); aoa.push(est);
