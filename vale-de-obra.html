<title>Vale de Obra</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: centro de control en cristal oscuro (misma línea de Rendimientos AyC). Menú lateral flotante (barra inferior en celular), contenido en rejilla de 12 columnas, luz ambiente azul de marca y naranja de fachada. */
:root {
  --bg: #04070d;
  --surface: rgba(14, 22, 38, .66);
  --surface-solid: #0e1626;
  --surface-2: rgba(255, 255, 255, .045);
  --surface-3: rgba(255, 255, 255, .08);
  --ink: #edf2fa;
  --ink-2: #a8b5c8;
  --muted: #6f7d92;
  --line: rgba(140, 170, 220, .13);
  --line-2: rgba(140, 170, 220, .24);
  --brand: #1e4164;          /* azul Arquitectura & Concreto */
  --accent: #4d8dff;
  --accent-2: #8b6cff;
  --accent-ink: #04101f;
  --accent-soft: rgba(77, 141, 255, .15);
  --ext: #ff7a3d;            /* naranja: lo que se paga */
  --int: #3d8bff;            /* azul: lo ejecutado */
  --glow-ext: rgba(255, 122, 61, .55);
  --glow-int: rgba(61, 139, 255, .6);
  --glow-acc: rgba(77, 141, 255, .55);
  --good: #33d17a; --warn: #f5b83d; --crit: #ff5a5f;
  --good-bg: rgba(51, 209, 122, .13); --warn-bg: rgba(245, 184, 61, .13); --crit-bg: rgba(255, 90, 95, .13);
  --good-ink: #7ff0ad; --warn-ink: #ffd27a; --crit-ink: #ff9da0;
  --amb-1: rgba(37, 99, 235, .34); --amb-2: rgba(234, 108, 46, .26); --amb-3: rgba(30, 65, 100, .6);
  --shadow: 0 12px 40px rgba(0, 0, 0, .35);
  --tip-bg: #e9eef7; --tip-ink: #0b1424;
  --logo-blanco: block; --logo-azul: none;
  --font-display: "Sora", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 18px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #eef2f8; --surface: rgba(255, 255, 255, .74); --surface-solid: #ffffff; --surface-2: rgba(30, 65, 100, .05); --surface-3: rgba(30, 65, 100, .09);
    --ink: #0e1b2c; --ink-2: #3f4f66; --muted: #67768e; --line: rgba(30, 65, 100, .12); --line-2: rgba(30, 65, 100, .24);
    --accent: #1f5fd6; --accent-2: #6a4fe0; --accent-ink: #ffffff; --accent-soft: rgba(31, 95, 214, .11);
    --ext: #eb6834; --int: #2a78d6; --glow-ext: rgba(235, 104, 52, .22); --glow-int: rgba(42, 120, 214, .22); --glow-acc: rgba(31, 95, 214, .22);
    --good: #0ca30c; --warn: #d99a00; --crit: #d03b3b; --good-bg: #dcf2dc; --warn-bg: #fbefc9; --crit-bg: #f8dcda;
    --good-ink: #0d5a0d; --warn-ink: #6b4a00; --crit-ink: #8f1f1f;
    --amb-1: rgba(37, 99, 235, .13); --amb-2: rgba(234, 108, 46, .11); --amb-3: rgba(30, 65, 100, .10);
    --shadow: 0 8px 30px rgba(30, 65, 100, .10); --tip-bg: #0e1b2c; --tip-ink: #eef2f8;
    --logo-blanco: none; --logo-azul: block;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #eef2f8; --surface: rgba(255, 255, 255, .74); --surface-solid: #ffffff; --surface-2: rgba(30, 65, 100, .05); --surface-3: rgba(30, 65, 100, .09);
  --ink: #0e1b2c; --ink-2: #3f4f66; --muted: #67768e; --line: rgba(30, 65, 100, .12); --line-2: rgba(30, 65, 100, .24);
  --accent: #1f5fd6; --accent-2: #6a4fe0; --accent-ink: #ffffff; --accent-soft: rgba(31, 95, 214, .11);
  --ext: #eb6834; --int: #2a78d6; --glow-ext: rgba(235, 104, 52, .22); --glow-int: rgba(42, 120, 214, .22); --glow-acc: rgba(31, 95, 214, .22);
  --good: #0ca30c; --warn: #d99a00; --crit: #d03b3b; --good-bg: #dcf2dc; --warn-bg: #fbefc9; --crit-bg: #f8dcda;
  --good-ink: #0d5a0d; --warn-ink: #6b4a00; --crit-ink: #8f1f1f;
  --amb-1: rgba(37, 99, 235, .13); --amb-2: rgba(234, 108, 46, .11); --amb-3: rgba(30, 65, 100, .10);
  --shadow: 0 8px 30px rgba(30, 65, 100, .10); --tip-bg: #0e1b2c; --tip-ink: #eef2f8;
  --logo-blanco: none; --logo-azul: block;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(900px 600px at 105% -10%, var(--amb-1), transparent 60%),
    radial-gradient(700px 520px at 100% 85%, var(--amb-2), transparent 62%),
    radial-gradient(800px 600px at -10% 10%, var(--amb-3), transparent 60%); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.logo-b { display: var(--logo-blanco); }
.logo-a { display: var(--logo-azul); }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }

/* Estructura */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.side { position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); align-self: start; height: calc(100dvh - 32px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); margin-block: 16px; display: flex; flex-direction: column; gap: 18px; padding: 20px 14px; border-radius: 22px; background: var(--surface); border: 1px solid var(--line); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, .05); }
.side .logo { padding: 2px 8px 6px; }
.side .logo img { width: 100%; max-width: 180px; height: auto; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav button { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: none; color: var(--ink-2); padding: 10px 12px; border-radius: 12px; cursor: pointer; font-weight: 500; text-align: left; white-space: nowrap; }
.nav button svg { width: 20px; height: 20px; flex: none; }
.nav button:hover { background: var(--surface-2); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--accent-soft); color: var(--ink); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent); }
.nav button[aria-current="page"] svg { color: var(--accent); filter: drop-shadow(0 0 6px var(--glow-acc)); }
.side-foot { margin-top: auto; display: grid; gap: 10px; }
.side-corte { display: grid; gap: 6px; text-align: left; border: 1px solid var(--line); background: var(--surface-2); border-radius: 14px; padding: 12px; cursor: pointer; }
.side-corte:hover { border-color: var(--accent); }
.side-corte b { font-family: var(--font-display); font-weight: 600; font-size: 15px; }
.side-corte .v { font-family: var(--font-display); font-weight: 600; font-size: 17px; font-variant-numeric: tabular-nums; }
.theme-btn { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-2); border-radius: 12px; padding: 9px 12px; cursor: pointer; font-weight: 500; }
.theme-btn svg { width: 18px; height: 18px; }
.theme-btn:hover { color: var(--ink); border-color: var(--line-2); }
.side-obra { font-size: 12px; color: var(--muted); padding: 0 6px; line-height: 1.35; }
.side-obra b { display: block; color: var(--ink); font-weight: 600; font-size: 13px; }

.content { min-width: 0; padding-block: 18px 48px; }
.topbar { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.topbar .t-left { display: flex; align-items: center; gap: 16px; min-width: 0; }
.topbar .t-logo { display: none; height: 40px; width: auto; }
.topbar h1 { margin: 2px 0 0; font-family: var(--font-display); font-weight: 600; font-size: 26px; letter-spacing: -.01em; line-height: 1.1; text-wrap: balance; }
.topbar .t-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pill-glass { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); font-size: 13px; color: var(--ink-2); }
.pill-glass select { border: 0; background: transparent; padding: 0 18px 0 0; font-weight: 600; color: var(--ink); max-width: 240px; }
.pill-glass select option { background: var(--surface-solid); color: var(--ink); }
.pill-glass .live { width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 8px var(--good); }
.topbar .theme-btn { display: none; padding: 7px 10px; }
#view { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
#view > *, .panel, .corte-grid > *, .dash > *, .mem-grid > * { min-width: 0; }

/* Tarjetas */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, .04); position: relative; }
.panel > .hd { padding: 18px 18px 10px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
.panel > .bd { padding: 0 18px 18px; }
.panel.pad { padding: 18px; }
h2, h3 { margin: 0; font-family: var(--font-display); font-weight: 600; letter-spacing: -.005em; text-wrap: balance; }
h2 { font-size: 16px; }
h2.big { font-size: 22px; letter-spacing: -.015em; }
h2 small, h3 small { font-family: var(--font-body); font-weight: 400; font-size: 12px; color: var(--muted); margin-left: 6px; }
.eyebrow { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.hint { color: var(--muted); font-size: 12px; font-weight: 400; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }

/* Controles */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); background: var(--surface-2); padding: 8px 14px; border-radius: 10px; cursor: pointer; font-weight: 500; color: var(--ink); }
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent; color: #fff; font-weight: 600; box-shadow: 0 6px 22px var(--glow-acc); }
.btn.primary:disabled { box-shadow: none; }
.btn.danger { color: var(--crit); }
.btn.small { padding: 4px 10px; font-size: 12.5px; }
.btn svg { width: 16px; height: 16px; }
label.fld { display: flex; flex-direction: column; gap: 5px; min-width: 0; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.inp, select.inp, textarea.inp { font-family: var(--font-body); font-size: 14px; letter-spacing: 0; text-transform: none; width: 100%; background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 10px; padding: 8px 11px; min-width: 0; color: var(--ink); }
.inp:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.inp:disabled { color: var(--muted); }
select option { background: var(--surface-solid); color: var(--ink); }
input::placeholder { color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; }
.grid-f { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(150px, 100%), 1fr)); gap: 12px; }

/* Selector de cortes */
.chips { display: flex; gap: 7px; overflow-x: auto; padding: 2px; scrollbar-width: thin; }
.chip { border: 1px solid var(--line-2); background: var(--surface-2); border-radius: 11px; padding: 7px 12px; cursor: pointer; display: grid; text-align: left; min-width: 72px; line-height: 1.25; color: var(--ink); }
.chip b { font-weight: 600; font-size: 13.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip span { font-size: 11px; }
.chip:hover { border-color: var(--line-2); background: var(--surface-3); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent), 0 0 16px var(--glow-acc); }
.chip.add { color: var(--accent); font-weight: 600; place-items: center; border-style: dashed; white-space: nowrap; }

.pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 99px; background: var(--surface-3); color: var(--ink-2); white-space: nowrap; }
.pill.st-borrador { background: var(--surface-3); color: var(--ink-2); }
.pill.st-aprobado { background: var(--warn-bg); color: var(--warn-ink); }
.pill.st-pagado { background: var(--good-bg); color: var(--good-ink); }
.chip span.st-borrador { color: var(--muted); }
.chip span.st-aprobado { color: var(--warn-ink); }
.chip span.st-pagado { color: var(--good-ink); }

/* Tablas */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; margin: 0 18px 18px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-family: var(--font-mono); font-weight: 500; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); background: var(--surface-solid); padding: 9px 10px; white-space: nowrap; position: sticky; top: 0; z-index: 1; vertical-align: bottom; }
td { padding: 8px 10px; border-top: 1px solid var(--line); vertical-align: middle; }
th.num { text-align: right; }
td.now { background: var(--accent-soft); }
th.now { color: var(--accent); }
tr.grp td { background: var(--surface-2); font-weight: 600; font-family: var(--font-display); font-size: 13.5px; }
tr.sub td { font-weight: 700; border-top: 1px solid var(--line-2); }
td.desc { min-width: 240px; }
td .cod { color: var(--muted); font-size: 11.5px; font-family: var(--font-mono); }
tr.zero td { color: var(--muted); }
.over { color: var(--crit-ink); font-weight: 600; }
.tbl-inp { width: 100%; min-width: 72px; border: 1px solid transparent; background: transparent; padding: 5px 7px; border-radius: 8px; text-align: inherit; color: var(--ink); font-size: 13px; }
.tbl-inp:hover { border-color: var(--line-2); }
.tbl-inp:focus { border-color: var(--accent); background: var(--surface-2); outline: none; }

/* Liquidación */
.liq { display: grid; }
.liq div { display: flex; justify-content: space-between; gap: 16px; padding: 8px 0; border-top: 1px solid var(--line); }
.liq div:first-child { border-top: 0; }
.liq div span:last-child { font-variant-numeric: tabular-nums; }
.liq .neg span:last-child { color: var(--crit-ink); }
.liq .tot { border: 0; margin-top: 10px; padding: 14px 16px; border-radius: 14px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; box-shadow: 0 8px 26px var(--glow-acc); align-items: baseline; }
.liq .tot span:first-child { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
.liq .tot span:last-child { font-family: var(--font-display); font-weight: 600; font-size: 24px; letter-spacing: -.02em; }
.corte-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }

/* Inicio / dashboard */
.dash { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; align-items: start; }
.s8 { grid-column: span 8; } .s7 { grid-column: span 7; } .s6 { grid-column: span 6; } .s5 { grid-column: span 5; } .s4 { grid-column: span 4; } .s12 { grid-column: span 12; }
.hero { overflow: hidden; display: flex; flex-direction: column; gap: 6px; min-height: 250px; padding: 18px; }
.hero .hi { font-size: 15px; color: var(--ink-2); }
.hero p { margin: 4px 0 0; color: var(--ink-2); max-width: 52ch; }
.hero .spark { margin-top: auto; }
.clock { position: absolute; top: 16px; right: 16px; font-variant-numeric: tabular-nums; }
.bignum { font-family: var(--font-display); font-weight: 600; font-size: 46px; line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.bignum small { font-size: 22px; font-weight: 500; color: var(--ink-2); margin-left: 2px; }
.split { display: flex; gap: 18px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.mini-stats { display: flex; gap: 26px; flex-wrap: wrap; margin-top: 16px; }
.mini-stats > div { display: grid; gap: 3px; }
.mini-stats b { font-family: var(--font-display); font-weight: 600; font-size: 18px; font-variant-numeric: tabular-nums; }
.ring { display: block; }
.ring .rv { fill: var(--ink); font-family: var(--font-display); font-weight: 600; }
.ring .rs { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.ring .rt { stroke: var(--surface-3); }
.center { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(190px, 100%), 1fr)); gap: 14px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; min-width: 0; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: var(--shadow); }
.kpi .v { font-family: var(--font-display); font-weight: 600; font-size: 26px; line-height: 1.05; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.kpi .d { font-size: 12px; color: var(--muted); }
.bullet { position: relative; height: 8px; background: var(--surface-3); border-radius: 99px; margin-top: 4px; overflow: hidden; }
.bullet .fill { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: var(--accent); box-shadow: 0 0 12px var(--glow-acc); }
.list { display: grid; }
.list-row { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
.list-row:first-child { border-top: 0; }
.list-row .ck { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.ck.good { background: var(--good); color: #04130a; box-shadow: 0 0 10px color-mix(in srgb, var(--good) 60%, transparent); }
.ck.warn { border: 2px solid var(--warn); }
.ck.none { border: 2px solid var(--line-2); }
.list-row .nm { min-width: 0; }
.list-row .nm span { display: block; font-size: 11.5px; color: var(--muted); }
.list-row .rt2 { display: grid; justify-items: end; gap: 2px; }
.hbars { display: grid; gap: 10px; }
.hbar { display: grid; grid-template-columns: minmax(90px, 36%) 1fr auto; gap: 10px; align-items: center; font-size: 13px; }
.hbar .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar .track { height: 8px; background: var(--surface-3); border-radius: 99px; overflow: hidden; display: flex; gap: 2px; }
.hbar .track span { height: 100%; border-radius: 99px; }
.hbar .val { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 64px; text-align: right; }
.s-ext { background: linear-gradient(90deg, color-mix(in srgb, var(--ext) 70%, transparent), var(--ext)); box-shadow: 0 0 10px var(--glow-ext); }
.s-int { background: linear-gradient(90deg, color-mix(in srgb, var(--int) 70%, transparent), var(--int)); box-shadow: 0 0 10px var(--glow-int); }
.s-crit { background: var(--crit); box-shadow: 0 0 10px color-mix(in srgb, var(--crit) 60%, transparent); }
.filters { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; }

/* Gráficas */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .ax { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.chart .ax.on { fill: var(--ink); font-weight: 600; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .base { stroke: var(--line-2); stroke-width: 1; }
.chart .trk { fill: var(--surface-2); }
.chart .hit { fill: transparent; cursor: crosshair; }
.chart .hit:hover { fill: var(--surface-2); }
.chart .hit:focus { outline: none; }
.chart .hit:focus-visible { stroke: var(--accent); stroke-width: 1.5; }
.chart .xh { stroke: var(--line-2); stroke-width: 1; stroke-dasharray: 3 3; }
.chart .lbl { fill: var(--ink-2); font-size: 11px; font-weight: 600; font-family: var(--font-body); }
.chart .bub rect { fill: var(--surface-3); stroke: var(--line-2); }
.chart .bub text { fill: var(--ink); font-size: 11px; font-weight: 600; font-family: var(--font-body); }

      if (name == null) throw new Error(`«${tk.v}» no es una medida de esta hoja`);

async function guard(p, okMsg) {

  catch (e) {
    const code = e && e.code;
    if (code === "revoked" || code === "not_granted") { S.canWrite = false; toast("Tu acceso no permite editar este proyecto. Los cambios no se guardaron."); render(true); }
    else if (code === "quota_exceeded") toast("La base de datos del proyecto está llena. Elimina elementos antiguos para seguir agregando.");
    else if (code === "invalid_argument") toast("No se guardó: tu acceso no permite editar, o el documento quedó demasiado grande. Si tienes permiso, guarda por partes.");
    else if (code === "resource_exhausted") toast("Demasiadas escrituras seguidas. Espera unos segundos e intenta de nuevo.");

    return false;
  }
}

async function deleteCorte(c) {
  const co = S.cortes[c]; if (!co || co.estado !== "borrador") { toast("Solo se pueden eliminar cortes en borrador."); return; }
  const changes = [], rm = {}, { byHoja } = elIndex();
  for (const [h, els] of Object.entries(byHoja)) for (const e of els) {
    const acts = Object.values(e.a || {});
    // los típicos creados para este corte se borran; el resto vuelve a quedar pendiente
    if (e.tip && acts.length && acts.every((a) => a.c === co.n || !a.c)) { (rm[e.docId] ||= []).push(e.id); continue; }
    for (const ac of S.hojas[h].acts || []) if (e.a?.[ac.k]?.c === co.n) changes.push({ docId: e.docId, id: e.id, k: ac.k, c: null });
  }
  for (const [docId, ids] of Object.entries(rm)) { const d = S.memo[docId], els = { ...d.els }; ids.forEach((i) => delete els[i]); if (!(await guard(S.db.doc("memoria/" + docId).set({ ...d, els })))) return; }
  if (changes.length && !(await setActs(changes))) return;
  if (await guard(S.db.doc("cortes/" + c).delete(), `Corte ${co.n} eliminado. ${changes.length ? changes.length + " actividades quedaron pendientes otra vez." : ""}`)) {
    const cs = cortesSorted().filter((x) => x.id !== c); S.sel = cs.length ? cs[cs.length - 1].id : null; S.dash.hasta = null; S.mem.dest = null; render(true);
  }
}

let ELC = null; // caché de elementos por hoja y de sumas por corte
function elIndex() {
  if (ELC) return ELC;
  const byHoja = {}, sums = {}, sumsH = {};
  for (const [docId, d] of Object.entries(S.memo)) {
    const H = S.hojas[d.hoja]; if (!H) continue;
    for (const [id, e] of Object.entries(d.els || {})) {
      if (!e) continue;
      (byHoja[d.hoja] ||= []).push({ docId, id, ...e });
      for (const ac of H.acts || []) {
        const a = e.a && e.a[ac.k]; if (!a || !a.c || !ac.item) continue;
        const q = +a.q || 0;
        const m = (sums[a.c] ||= {}); m[ac.item] = (m[ac.item] || 0) + q;
        const mh = ((sumsH[a.c] ||= {})[d.hoja] ||= {}); mh[ac.item] = (mh[ac.item] || 0) + q;
      }
    }
  }
  for (const h in byHoja) byHoja[h].sort(isLog(S.hojas[h])
    ? (x, y) => natCmp(x.fi || x.ff, y.fi || y.ff) || (x.o || 0) - (y.o || 0)
    : (x, y) => (x.piso === "SP" || !x.piso ? -1 : 0) - (y.piso === "SP" || !y.piso ? -1 : 0) || natCmp(x.piso, y.piso) || (x.o || 0) - (y.o || 0));
  return (ELC = { byHoja, sums, sumsH });
}

    const id = "i" + String(n).padStart(3, "0"), last = its.filter((i) => grupoOf(i)).slice(-1)[0];
    const g = last && /^\d+$/.test(grupoOf(last)) ? String(+grupoOf(last) + 1) : "";

  });
}

let pdfP;
function loadPDF() {
  if (window.jspdf) return Promise.resolve(window.jspdf);
  return (pdfP ||= new Promise((res, rej) => {
    const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js";
    s.onload = () => (window.jspdf ? res(window.jspdf) : rej()); s.onerror = () => { pdfP = null; rej(); }; document.head.appendChild(s);

async function logoData(path) {
  try {
    const r = await fetch(path); if (!r.ok) return null;
    const b = await r.blob();
    return await new Promise((ok) => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.onerror = () => ok(null); fr.readAsDataURL(b); });
  } catch { return null; }
}
const PC = { navy: [31, 56, 92], band: [221, 235, 247], zona: [189, 215, 238], head: [128, 128, 128], line: [166, 166, 166], blue: [47, 117, 181],
  vuBg: [221, 235, 247], green: [55, 86, 35], goodBg: [226, 239, 218], critBg: [248, 203, 173], grayBg: [242, 242, 242], sub: [84, 130, 53], white: [255, 255, 255], ink: [0, 0, 0], muted: [110, 110, 110] };
const pdfTxt = (s) => String(s ?? "").replace(/−/g, "-").replace(/[≥]/g, ">=");
function pcell(doc, x, y, w, h, o = {}) {
  const { fill, text, align = "left", bold = false, color = PC.ink, size = 7, border = true, money = false, dec = 2, padX = 3 } = o;
  if (fill) { doc.setFillColor(...fill); doc.rect(x, y, w, h, "F"); }
  if (border) { doc.setDrawColor(...PC.line); doc.setLineWidth(0.35); doc.rect(x, y, w, h, "S"); }
  if (text == null || text === "") return;
  doc.setFont("helvetica", bold ? "bold" : "normal"); doc.setFontSize(size); doc.setTextColor(...color);
  if (money) {
    const ty = y + h / 2 + size * 0.35, v = +text;
    doc.text(v < 0 ? "-$" : "$", x + padX, ty);
    doc.text(Math.abs(v) < 0.005 ? "-" : (dec ? nf2 : nf0).format(Math.abs(v)), x + w - padX, ty, { align: "right" });
    return;
  }
  const lines = pdfTxt(text).split("\n").map((t) => { let s = t; while (s.length > 1 && doc.getTextWidth(s) > w - 2 * padX) s = s.slice(0, -2) + "…"; return s; });
  const lh = size * 1.12, ty0 = y + h / 2 - ((lines.length - 1) * lh) / 2 + size * 0.35;
  lines.forEach((t, i) => {
    const yy = ty0 + i * lh;
    if (align === "right") doc.text(t, x + w - padX, yy, { align: "right" });
    else if (align === "center") doc.text(t, x + w / 2, yy, { align: "center" });
    else doc.text(t, x + padX, yy);
  });
}
function pdfCols(weights, x0, W) {
  const tot = weights.reduce((a, b) => a + b, 0); let x = x0;
  return weights.map((w) => { const c = { x, w: (w / tot) * W }; x += c.w; return c; });
}
function pdfTitle(doc, { m, W, logo, title, sub }) {
  pcell(doc, m, m, W, 36, { fill: PC.navy, border: false });
  if (logo) { try { doc.addImage(logo, "PNG", m + 8, m + 3, 58, 30); } catch {} }
  pcell(doc, m + 76, m, W - 152, 36, { text: title, align: "center", bold: true, color: PC.white, size: 9.5, border: false });
  pcell(doc, m, m + 36, W, 12, { fill: PC.band, text: sub, align: "center", color: PC.sub, size: 6.5, border: false });
  return m + 54;
}
async function exportInforme(c, anexo, btn) {

    };

    if (p.zona) {

      doc.setFillColor(...PC.navy); doc.rect(m + 4, y + 3, 3, 8, "F");
      pcell(doc, m + 10, y, W - 10, 14, { text: "ZONA: " + p.zona.toUpperCase(), bold: true, color: PC.navy, size: 7.5, border: false });

    }
    for (const r of actaRows(K)) {
